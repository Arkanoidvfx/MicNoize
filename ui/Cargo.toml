[package]
name = "micnoize"
version = "0.3.15"
edition = "2024"
rust-version = "1.97"
build = "build.rs"

[dependencies]
base64 = "0.22"
# DeepFilterNet 3 (MIT/Apache-2.0) for the CPU denoiser; not on crates.io past 0.2.5, so the
# v0.5.6 release commit is pinned. `default-model` embeds the 8 MB DFN3 model.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
ed25519-dalek = "2"
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "advanced"] }
# Iced's own renderer; `geometry` draws the slanted slider shapes as anti-aliased paths.
iced_tiny_skia = { version = "=0.14.1", default-features = false, features = ["geometry"] }
# Iced's rasterizer, used directly to paint pages offscreen for the page-switch pixelation.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
png = "0.18"
hex = "0.4"
hmac = "0.12"
ndarray = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "pcm", "aac", "isomp4", "opt-simd"] }
ureq = "3"
uuid = { version = "1", features = ["v4"] }
velopack = "=1.2.110-ge826545"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = "debuginfo"
